[build]
  publish = "dist"
  command = "npm run build"

[functions]
  directory = "netlify/functions"

[functions."gas-proxy"]
  timeout = 26

[[redirects]]
  from = "/api/gas-proxy"
  to = "/.netlify/functions/gas-proxy"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
